services:
  # ── PostgreSQL ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: skg_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skgpassword}
      POSTGRES_DB: ${POSTGRES_DB:-software_knowledge_graph}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-skguser} -d ${POSTGRES_DB:-software_knowledge_graph}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  # ── Neo4j ────────────────────────────────────────────────────
  neo4j:
    image: neo4j:5
    container_name: skg_neo4j
    restart: unless-stopped

    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-neo4jpassword}
      NEO4J_PLUGINS: '["apoc"]'

    ports:
      - "7474:7474"
      - "7687:7687"

    volumes:
      - neo4j_data:/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s


  # ── Qdrant ───────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: skg_qdrant
    restart: unless-stopped

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_data:/qdrant/storage

    # Qdrant's image does not contain wget,
    # so do not use a wget-based healthcheck here.


  # ── Redis ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: skg_redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s


  # ── Backend (FastAPI) ────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: skg_backend
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_HOST: postgres
      NEO4J_URI: bolt://neo4j:7687
      QDRANT_HOST: qdrant
      REDIS_URL: redis://redis:6379

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app
      - repos_data:/app/repos

    depends_on:
      postgres:
        condition: service_healthy

      neo4j:
        condition: service_healthy

      qdrant:
        condition: service_started

      redis:
        condition: service_healthy


  # ── Frontend (Next.js) ───────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: skg_frontend
    restart: unless-stopped

    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000

    ports:
      - "3000:3000"

    depends_on:
      - backend


# ── Persistent Volumes ─────────────────────────────────────────
volumes:
  postgres_data:
  neo4j_data:
  qdrant_data:
  redis_data:
  repos_data:

